<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none" width="400" height="250">
  <!-- Background -->
  <rect width="400" height="250" fill="#f3f4f6"/>
  <!-- Shadow -->
  <ellipse cx="190" cy="210" rx="110" ry="18" fill="#00000010"/>
  
  <!-- Wheels -->
  <circle cx="95" cy="190" r="26" fill="#111827"/>
  <circle cx="95" cy="190" r="20" fill="#374151"/>
  <circle cx="95" cy="190" r="4" fill="#6b7280"/>
  
  <circle cx="285" cy="180" r="24" fill="#111827"/>
  <circle cx="285" cy="180" r="18" fill="#374151"/>
  <circle cx="285" cy="180" r="4" fill="#6b7280"/>
  
  <!-- Frame -->
  <path d="M95 160 L110 140 L140 130 L170 130 L200 150 L240 150 L260 165 L285 150" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 140 L100 120 L130 115" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <path d="M140 130 L145 100 L180 95" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <path d="M200 150 L210 135 L240 135" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Engine -->
  <rect x="145" y="105" width="45" height="25" rx="4" fill="#ef4444"/>
  <circle cx="160" cy="118" r="3" fill="#111827"/>
  
  <!-- Seat -->
  <path d="M180 95 Q200 85 240 95 L260 95 L180 95 Z" fill="#111827" opacity="0.9"/>
  
  <!-- Handlebars -->
  <path d="M145 100 L150 85 L170 80" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <path d="M185 100 L190 85 L210 80" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Exhaust -->
  <path d="M140 130 L130 170 L115 175" stroke="#6b7280" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Fuel tank -->
  <path d="M145 105 Q160 90 185 105 Q200 110 185 125 Q160 120 145 105 Z" fill="#f59e0b"/>
  
  <!-- Fenders -->
  <path d="M60 175 Q95 160 130 175" stroke="#374151" stroke-width="4" fill="none"/>
  <path d="M250 160 Q285 150 320 160" stroke="#374151" stroke-width="4" fill="none"/>
  
  <!-- Headlight -->
  <circle cx="55" cy="150" r="10" fill="#fbbf24"/>
  
  <!-- Brand badge -->
  <rect x="320" y="20" width="60" height="24" rx="12" fill="#374151"/>
  <text x="350" y="38" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">SUZUKI</text>
</svg>
