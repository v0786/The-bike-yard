  <circle cx="155" cy="118" r="3" fill="#111827"/>
  
  <!-- Seat -->
  <path d="M175 95 Q195 85 235 95 L255 95 L175 95 Z" fill="#111827" opacity="0.9"/>
  
  <!-- Handlebars -->
  <path d="M140 100 L145 85 L165 80" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <path d="M180 100 L185 85 L205 80" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Exhaust -->
