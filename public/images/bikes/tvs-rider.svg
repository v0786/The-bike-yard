  <path d="M105 140 L95 120 L125 115" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <path d="M135 130 L140 100 L175 95" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  <path d="M195 150 L205 135 L235 135" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Engine -->
