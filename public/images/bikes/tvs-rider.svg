  <circle cx="90" cy="190" r="20" fill="#374151"/>
  <circle cx="90" cy="190" r="4" fill="#6b7280"/>
  
  <circle cx="280" cy="180" r="24" fill="#111827"/>
  <circle cx="280" cy="180" r="18" fill="#374151"/>
  <circle cx="280" cy="180" r="4" fill="#6b7280"/>
  
  <!-- Frame -->
