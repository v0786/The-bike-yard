  <circle cx="105" cy="190" r="16" fill="#374151"/>
  <circle cx="105" cy="190" r="4" fill="#6b7280"/>
  
  <circle cx="275" cy="185" r="20" fill="#111827"/>
  <circle cx="275" cy="185" r="14" fill="#374151"/>
  <circle cx="275" cy="185" r="4" fill="#6b7280"/>
  
  <!-- Scooter body -->
  <path d="M105 165 Q130 155 170 160 L230 165 L265 170 Q290 180 290 195 Q290 205 260 205 L140 205 Q110 205 105 190 Z" fill="#dc2626"/>
  
